<!DOCTYPE html>
<html lang="da">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>JKF Chatbot Træning</title>
    <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@300;400;500;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body, html { width: 100%; height: 100%; font-family: 'Roboto', Arial, sans-serif; overflow: hidden; background-color: #ffffff; }

        #training-chatbot-container { width: 100%; height: 100%; display: flex; flex-direction: column; background-color: #ffffff; }

        .training-chat-header {
            background-color: var(--primary-color, #1a56db);
            color: #ffffff;
            padding: 15px;
            display: flex;
            align-items: center;
            justify-content: center;
            position: relative;
            min-height: 80px;
            flex-shrink: 0;
        }
        .training-header-logo { height: 55px; max-width: 200px; }
        .training-status {
            display: flex; flex-direction: column; align-items: flex-start;
            position: absolute; left: 15px; top: 50%; transform: translateY(-50%);
        }
        .training-status-text { font-size: 13.5px; margin-bottom: 2px; }
        .training-chatbot-name { font-weight: bold; }
        .training-status-active { display: flex; align-items: center; gap: 5px; }
        .training-status-dot {
            width: 8px; height: 8px; background-color: #4CAF50; border-radius: 50%;
            animation: pulse 1.5s infinite;
        }
        @keyframes pulse {
            0%   { transform: scale(0.95); box-shadow: 0 0 0 0 rgba(76,175,80,0.7); }
            70%  { transform: scale(1);    box-shadow: 0 0 0 10px rgba(76,175,80,0); }
            100% { transform: scale(0.95); box-shadow: 0 0 0 0 rgba(76,175,80,0); }
        }
        .training-control-buttons {
            display: flex; align-items: center; position: absolute;
            top: 50%; right: 10px; transform: translateY(-50%); gap: 10px;
        }
        .training-restart-btn {
            width: 40px; height: 40px; background: transparent; border: none;
            cursor: pointer; border-radius: 50%; transition: background-color 0.2s;
            display: flex; align-items: center; justify-content: center; color: white; font-size: 16px;
        }
        .training-restart-btn:hover { background-color: rgba(255,255,255,0.2); }

        .training-disclaimer {
            padding: 8px; color: var(--disclaimer-color, #A0ABB6);
            font-size: 12px; text-align: center; font-style: italic;
            background-color: #ffffff; border-bottom: 1px solid #f0f0f0; flex-shrink: 0;
        }

        .training-chat-messages {
            flex: 1; overflow-y: auto; padding: 15px; background-color: #ffffff;
        }
        .training-chat-messages::-webkit-scrollbar { width: 6px; }
        .training-chat-messages::-webkit-scrollbar-track { background: transparent; }
        .training-chat-messages::-webkit-scrollbar-thumb { background-color: rgba(0,0,0,0.2); border-radius: 3px; }

        .training-message-container { display: flex; margin-bottom: 15px; }
        .training-user-message-container { justify-content: flex-end; }
        .training-assistant-message-container { justify-content: flex-start; align-items: center; gap: 8px; position: relative; }

        .training-message { max-width: 75%; padding: 12px 16px; font-size: 14px; word-wrap: break-word; line-height: 1.5; }
        .training-user-message { background-color: var(--primary-color, #1a56db); color: #ffffff; border-radius: 18px 18px 0 18px; }
        .training-assistant-message { background-color: #f0f0f0; color: #000000; border-radius: 18px 18px 18px 0; }

        .training-edit-btn {
            background-color: #017BFF; border: none; border-radius: 4px; padding: 6px 12px;
            cursor: pointer; opacity: 0; transition: opacity 0.2s ease, background-color 0.2s ease;
            font-size: 12px; color: #ffffff; z-index: 10;
            display: inline-flex; align-items: center; gap: 4px;
            flex-shrink: 0; white-space: nowrap; align-self: center; height: fit-content;
        }
        .training-assistant-message-container:hover .training-edit-btn { opacity: 1; }
        .training-edit-btn:hover { background-color: #0166d6; }
        .training-edit-btn i { font-size: 11px; }

        .training-assistant-message p { margin-bottom: 10px; }
        .training-assistant-message p:last-child { margin-bottom: 0; }
        .training-assistant-message ul { list-style-type: disc; padding-left: 20px; margin: 10px 0; }
        .training-assistant-message li { margin-bottom: 5px; }
        .training-assistant-message a { color: #0000FF; text-decoration: underline; }
        .training-assistant-message a:hover { text-decoration: none; }

        .training-quick-questions-section { padding: 16px 15px 14px 15px; background-color: transparent; flex-shrink: 0; }
        .training-quick-questions { display: flex; flex-wrap: wrap; gap: 0; width: 100%; align-items: center; justify-content: flex-start; }
        .training-quick-question-btn {
            background: #f8f9fa; color: #495057; border: 1px solid #e9ecef;
            border-radius: 18px; padding: 8px 14px; margin: 4px;
            font-size: 13px; cursor: pointer; transition: all 0.15s ease;
            font-family: 'Roboto', Arial, sans-serif; white-space: nowrap;
            box-shadow: 0 1px 2px rgba(0,0,0,0.04); display: inline-block;
        }
        .training-quick-question-btn:hover {
            background: #ffffff; color: #212529; border-color: #dee2e6;
            transform: translateY(-1px); box-shadow: 0 2px 5px rgba(0,0,0,0.08);
        }

        .training-chat-input-section {
            padding: 15px; background-color: #ffffff; border-top: 1px solid #f0f0f0; flex-shrink: 0;
        }
        .training-chat-input {
            display: flex; align-items: center; position: relative;
            background-color: #FAFAFA; border-radius: 8px; padding: 8px;
        }
        .training-chat-input input {
            flex: 1; color: #000000; border: none; padding: 8px 40px 8px 4px;
            font-size: 14px; outline: none; background-color: transparent;
            font-family: 'Roboto', Arial, sans-serif;
        }
        .training-send-btn {
            position: absolute; right: 12px; width: 22px; height: 22px;
            background: none; border: none; cursor: pointer; padding: 0;
            display: flex; align-items: center; justify-content: center;
            color: #A0ABB6; transition: color 0.2s;
        }
        .training-send-btn:hover { color: #555; }
        .training-send-btn.disabled { opacity: 0.4; cursor: not-allowed; }

        .training-typing-indicator { display: inline-block; padding: 10px 15px; min-width: 50px; }
        .training-typing-indicator span {
            display: inline-block; width: 7px; height: 7px; background-color: #888;
            border-radius: 50%; margin: 0 3px; animation: bounce 1s infinite ease-in-out;
        }
        .training-typing-indicator span:nth-child(2) { animation-delay: 0.2s; }
        .training-typing-indicator span:nth-child(3) { animation-delay: 0.4s; }
        @keyframes bounce {
            0%, 80%, 100% { transform: translateY(0); }
            40%            { transform: translateY(-10px); }
        }
    </style>
</head>
<body>
    <div id="training-chatbot-container">
        <div class="training-chat-header">
            <img src="" class="training-header-logo" alt="Logo" id="training-logo" style="display:none;">
            <div class="training-status">
                <div class="training-status-text">
                    <strong><span class="training-chatbot-name" id="training-chatbot-name">JKF AI-assistent</span></strong>
                </div>
                <div class="training-status-active">
                    <div class="training-status-dot"></div>
                    <div class="training-status-text">Aktiv nu</div>
                </div>
            </div>
            <div class="training-control-buttons">
                <button id="training-restart-chat" class="training-restart-btn" title="Genstart samtale">
                    <i class="fas fa-redo-alt"></i>
                </button>
            </div>
        </div>

        <div class="training-disclaimer" id="training-disclaimer">
            Dette er kun vejledende svar
        </div>

        <div class="training-chat-messages" id="training-chat-messages">
            <div class="training-message-container training-assistant-message-container">
                <div class="training-message training-assistant-message" id="training-welcome-message">
                    Hej! Hvordan kan jeg hjælpe dig i dag?
                </div>
            </div>
        </div>

        <div class="training-quick-questions-section">
            <div class="training-quick-questions" id="training-quick-questions"></div>
        </div>

        <div class="training-chat-input-section">
            <div class="training-chat-input">
                <input type="text" id="training-user-input" placeholder="Stil et spørgsmål her...">
                <button class="training-send-btn" id="training-send-btn" title="Send">
                    <i class="fas fa-paper-plane"></i>
                </button>
            </div>
        </div>
    </div>

    <script>
        // Only allow when embedded in iframe
        if (window.self === window.top) {
            document.body.innerHTML = `
                <div style="display:flex;align-items:center;justify-content:center;height:100vh;font-family:Arial,sans-serif;text-align:center;padding:20px;">
                    <div>
                        <h1 style="color:#d32f2f;margin-bottom:10px;">Adgang nægtet</h1>
                        <p style="color:#666;">Denne side kan kun tilgås når den er indlejret i dashboardet.</p>
                    </div>
                </div>`;
            throw new Error('Direct access not allowed');
        }

        const BASE_URL = window.location.origin;
        const TRAINING_MODE = true;

        let threadId = null;
        let isAssistantResponding = false;
        let clientConfig = null;
        let quickQuestions = [];

        async function initThread() {
            try {
                const resp = await fetch(`${BASE_URL}/init_thread`, { method: 'POST', headers: { 'Content-Type': 'application/json' } });
                const data = await resp.json();
                threadId = data.thread_id;
            } catch (e) { console.error('initThread error:', e); }
        }

        async function loadClientConfig() {
            try {
                const resp = await fetch(`${BASE_URL}/chatbot_config`);
                clientConfig = await resp.json();

                if (clientConfig.logo_url) {
                    const logo = document.getElementById('training-logo');
                    logo.src = clientConfig.logo_url;
                    logo.style.display = '';
                }
                if (clientConfig.primary_color) {
                    document.documentElement.style.setProperty('--primary-color', clientConfig.primary_color);
                }
                if (clientConfig.chatbot_name) {
                    document.getElementById('training-chatbot-name').textContent = clientConfig.chatbot_name;
                }
                if (clientConfig.welcome_message) {
                    document.getElementById('training-welcome-message').textContent = clientConfig.welcome_message;
                }
                if (clientConfig.disclaimer_text) {
                    document.getElementById('training-disclaimer').textContent = clientConfig.disclaimer_text;
                }
                if (clientConfig.quick_questions && Array.isArray(clientConfig.quick_questions)) {
                    quickQuestions = clientConfig.quick_questions;
                }
            } catch (e) { console.error('loadClientConfig error:', e); }
        }

        function renderQuickQuestions() {
            const section = document.querySelector('.training-quick-questions-section');
            const container = document.getElementById('training-quick-questions');
            container.innerHTML = '';
            if (!quickQuestions || quickQuestions.length === 0) {
                section.style.display = 'none'; return;
            }
            const chatMessages = document.getElementById('training-chat-messages');
            if (chatMessages.querySelectorAll('.training-message-container').length > 1) {
                section.style.display = 'none'; return;
            }
            section.style.display = 'block';
            quickQuestions.forEach(q => {
                const btn = document.createElement('button');
                btn.className = 'training-quick-question-btn';
                btn.textContent = q;
                btn.onclick = () => { if (!isAssistantResponding) { document.getElementById('training-user-input').value = q; sendMessage(); } };
                container.appendChild(btn);
            });
        }

        function hideQuickQuestions() {
            document.querySelector('.training-quick-questions-section').style.display = 'none';
        }

        function scrollToBottom() {
            const el = document.getElementById('training-chat-messages');
            el.scrollTop = el.scrollHeight;
        }

        function addTypingIndicator() {
            const chatMessages = document.getElementById('training-chat-messages');
            const container = document.createElement('div');
            container.className = 'training-message-container training-assistant-message-container';
            container.id = 'typing-indicator-container';
            const indicator = document.createElement('div');
            indicator.className = 'training-message training-assistant-message training-typing-indicator';
            indicator.innerHTML = '<span></span><span></span><span></span>';
            container.appendChild(indicator);
            chatMessages.appendChild(container);
            scrollToBottom();
            return container;
        }

        function removeTypingIndicator() {
            const el = document.getElementById('typing-indicator-container');
            if (el) el.remove();
        }

        function addMessage(role, content, questionText = null) {
            const chatMessages = document.getElementById('training-chat-messages');
            const container = document.createElement('div');
            container.className = `training-message-container training-${role}-message-container`;
            const msgDiv = document.createElement('div');
            msgDiv.className = `training-message training-${role}-message`;
            if (role === 'user') {
                msgDiv.textContent = content;
            } else {
                msgDiv.innerHTML = content || '';
            }
            container.appendChild(msgDiv);
            if (role === 'assistant' && questionText !== null) {
                const editBtn = document.createElement('button');
                editBtn.className = 'training-edit-btn';
                editBtn.innerHTML = '<i class="fas fa-edit"></i>Ret';
                editBtn.onclick = (e) => { e.stopPropagation(); handleEditClick(questionText, msgDiv.innerHTML); };
                container.appendChild(editBtn);
            }
            chatMessages.appendChild(container);
            scrollToBottom();
            return msgDiv;
        }

        function handleEditClick(userQuestion, botAnswer) {
            window.parent.postMessage({ type: 'edit_response', question: userQuestion, answer: botAnswer }, '*');
        }

        async function sendMessage() {
            if (isAssistantResponding) return;
            const userInput = document.getElementById('training-user-input');
            const message = userInput.value.trim();
            if (!message) return;

            hideQuickQuestions();
            addMessage('user', message);
            userInput.value = '';
            isAssistantResponding = true;
            document.getElementById('training-send-btn').classList.add('disabled');

            addTypingIndicator();

            try {
                const response = await fetch(`${BASE_URL}/chat_stream`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ message, thread_id: threadId, training_mode: TRAINING_MODE }),
                });

                const reader = response.body.getReader();
                const decoder = new TextDecoder();
                let assistantMsgDiv = null;
                let firstContent = false;
                let accumulatedHtml = '';

                function readStream() {
                    reader.read().then(({ done, value }) => {
                        if (done) {
                            removeTypingIndicator();
                            if (!assistantMsgDiv) {
                                assistantMsgDiv = addMessage('assistant', 'Beklager, der opstod en fejl.', message);
                            }
                            isAssistantResponding = false;
                            document.getElementById('training-send-btn').classList.remove('disabled');
                            // Notify parent with final content
                            if (window.parent && window.parent !== window) {
                                window.parent.postMessage({ type: 'chatbot_response', question: message, answer: accumulatedHtml }, '*');
                            }
                            return;
                        }

                        const lines = decoder.decode(value, { stream: true }).split('\n');
                        for (const line of lines) {
                            if (!line.startsWith('data: ')) continue;
                            try {
                                const data = JSON.parse(line.substring(6));
                                if (data.type === 'thread_id') {
                                    threadId = data.content;
                                } else if (data.type === 'content') {
                                    if (!firstContent) {
                                        firstContent = true;
                                        removeTypingIndicator();
                                        assistantMsgDiv = addMessage('assistant', '', message);
                                    }
                                    accumulatedHtml = data.content;
                                    assistantMsgDiv.innerHTML = data.content;
                                    scrollToBottom();
                                } else if (data.type === 'done') {
                                    removeTypingIndicator();
                                    isAssistantResponding = false;
                                    document.getElementById('training-send-btn').classList.remove('disabled');
                                    if (!assistantMsgDiv) {
                                        assistantMsgDiv = addMessage('assistant', accumulatedHtml, message);
                                    }
                                    if (window.parent && window.parent !== window) {
                                        window.parent.postMessage({ type: 'chatbot_response', question: message, answer: accumulatedHtml }, '*');
                                    }
                                    return;
                                } else if (data.type === 'error') {
                                    removeTypingIndicator();
                                    if (!assistantMsgDiv) assistantMsgDiv = addMessage('assistant', 'Der opstod en fejl. Prøv venligst igen.', message);
                                    else assistantMsgDiv.innerHTML = 'Der opstod en fejl. Prøv venligst igen.';
                                    isAssistantResponding = false;
                                    document.getElementById('training-send-btn').classList.remove('disabled');
                                    return;
                                }
                            } catch (e) { /* ignore parse errors */ }
                        }
                        readStream();
                    }).catch(err => {
                        console.error('Stream read error:', err);
                        removeTypingIndicator();
                        isAssistantResponding = false;
                        document.getElementById('training-send-btn').classList.remove('disabled');
                    });
                }
                readStream();
            } catch (e) {
                console.error('sendMessage error:', e);
                removeTypingIndicator();
                addMessage('assistant', 'Der opstod en fejl. Prøv venligst igen.');
                isAssistantResponding = false;
                document.getElementById('training-send-btn').classList.remove('disabled');
            }
        }

        async function resetChat() {
            try {
                await fetch(`${BASE_URL}/training/reset`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ thread_id: threadId }),
                });
                threadId = null;
                await initThread();
                const chatMessages = document.getElementById('training-chat-messages');
                const welcomeMsg = (clientConfig && clientConfig.welcome_message) || 'Hej! Hvordan kan jeg hjælpe dig i dag?';
                chatMessages.innerHTML = `
                    <div class="training-message-container training-assistant-message-container">
                        <div class="training-message training-assistant-message" id="training-welcome-message">${welcomeMsg}</div>
                    </div>`;
                renderQuickQuestions();
            } catch (e) { console.error('resetChat error:', e); }
        }

        // Listen for messages from parent (e.g. sync-train trigger)
        window.addEventListener('message', function(event) {
            if (event.data && event.data.type === 'clear_training') { resetChat(); }
        });

        document.getElementById('training-user-input').addEventListener('keypress', e => {
            if (e.key === 'Enter' && !isAssistantResponding) sendMessage();
        });
        document.getElementById('training-send-btn').addEventListener('click', () => {
            if (!isAssistantResponding) sendMessage();
        });
        document.getElementById('training-restart-chat').addEventListener('click', resetChat);

        document.addEventListener('DOMContentLoaded', async () => {
            await loadClientConfig();
            await initThread();
            renderQuickQuestions();
        });
    </script>
</body>
</html>
